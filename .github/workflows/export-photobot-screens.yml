name: Export actual 3.3.6 interface screenshots
on:
  push:
    branches:
      - chatgpt/photobot-interactive-map-20261118
    paths:
      - .github/workflows/export-photobot-screens.yml
jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: photobot-real-screens-336
          path: docs/interface-336/screens/*.png
          retention-days: 2
          if-no-files-found: error
